name: pqc-inventory-agent
display_name: "PQC Enterprise Inventory & Application Compatibility Agent"
version: "4.1.0"
description: >
  Expert AI Agent for Post-Quantum Cryptography (PQC) Readiness Assessment, 4-Vector Live
  Application-to-Key Dependency Mapping, PQC Application Compatibility Evaluation, Mosca's
  Theorem (X+Y>Z) Risk Quantification, OWASP CycloneDX v1.6 CBOM Export, SDK/Gateway Code
  Refactoring, Preventive GCP Organization Policy Guardrails, and Recommended Google Cloud
  Security Architecture & Product BOM across Google Cloud Organizations
  (organizations/31564119954) and Projects, aligned with NIST FIPS 203 (ML-KEM / KEM_XWING),
  FIPS 204 (ML-DSA), FIPS 205 (SLH-DSA), NIST IR 8547, NIST SP 800-57, and NSA CNSA 2.0.

runtime:
  framework: google-adk
  target_platform: google_cloud_run
  optional_agent_engine_resource: "projects/110254026096/locations/us-central1/reasoningEngines/519268830350934016"
  cloud_run_url: "https://agentic-pqc-110254026096.us-central1.run.app/"
  cloud_run_dev_ui_url: ""  # ADK dev UI is disabled on Cloud Run (PQC_ENABLE_ADK_DEV_UI=false)
  python_version: "3.12"
  entrypoint: "main:app"
  adk_agent_module: "pqc_agent.agent:root_agent"
  persistence:
    transactional_database: "Cloud SQL for PostgreSQL 16"
    cloud_sql_connection_name_placeholder: "<PROJECT_ID>:<REGION>:<CLOUD_SQL_INSTANCE>"
    session_service: "DatabaseSessionService (postgresql+asyncpg)"
    auth_and_metadata_store: "DistributedAuthStore (postgresql+psycopg)"
    schema_migrations: "Alembic (head revision 20261117_0002: 20261117_0001_initial_phase1_phase2_schema.py -> 20261117_0002_add_adk_v1_session_schema.py)"
    credential_service: "EncryptedDatabaseCredentialService (Google Cloud KMS AES-256-GCM envelope encryption)"
    artifact_service: "GcsArtifactService (object storage only; never mounted as transactional database FUSE)"
    artifact_bucket: "gs://pqc-inventory-agent-cd06-pqc-agent-staging"

model:
  provider: "Vertex AI (Gemini only)"
  default: "gemini-3.1-pro-preview-customtools"
  default_thinking_level: "MEDIUM"
  selection: "Portal lists only Gemini models verified with a live Vertex AI request (GET /api/models)"
  fallback: "none (model errors are returned explicitly; no templated responses)"

agents:
  coordinator: pqc_inventory_agent
  specialists:
    - discovery_agent
    - correlation_analyst_agent
    - quantum_risk_agent
    - remediation_architect_agent
    - report_writer_agent

tools:
  evidence:
    - collect_kms_inventory
    - collect_workload_evidence
    - collect_tls_policies
    - collect_kms_import_jobs
    - discover_all_crypto_assets
    - read_uploaded_artifact
    - execute_gcloud_command
  auditable_calculations:
    - compute_pqc_scorecard
    - run_quantum_cryptanalysis_simulation
    - calibrate_assessment_context
    - get_historical_calibration_profile
  outputs:
    - export_cyclonedx_cbom
    - save_assessment_report

security:
  required_inventory_iam_roles:
    - "roles/resourcemanager.organizationViewer"
    - "roles/cloudkms.viewer"
    - "roles/cloudasset.viewer"
    - "roles/aiplatform.user"
  required_portal_infrastructure_iam_roles:
    - "roles/cloudsql.client"
    - "roles/secretmanager.secretAccessor (scoped to PQC_AUTH_SECRET, PQC_DB_PASSWORD, PQC_GOOGLE_OAUTH_CLIENT_SECRET)"
    - "roles/cloudkms.cryptoKeyEncrypterDecrypter (scoped exclusively to PQC_KMS_KEY_NAME portal DEK-wrapping key)"
  auth_mode: "cloud_iap_or_oauth2_authorization_code_pkce"
  credential_delegation_preferred: "service_account_impersonation_short_lived_read_only"
  credential_delegation_alternative: "kms_envelope_encrypted_3lo_delegated_token"
  portal_sign_in: "verified Cloud IAP JWT or OAuth 2.0 Authorization Code + PKCE S256 (HttpOnly SameSite=Lax Secure cookie + CSRF)"

environment:
  PQC_PRODUCTION_MODE: "true"
  GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
  GOOGLE_CLOUD_PROJECT: "pqc-inventory-agent-cd06"
  GOOGLE_CLOUD_LOCATION: "global"
  GCP_ORGANIZATION_ID: "31564119954"
  GCP_ORGANIZATION_NAME: "jsaccomani.altostrat.com"
  PQC_SIMULATION_MODE: "FALSE"
  PQC_AGENT_MODEL: "gemini-3.1-pro-preview-customtools"
  PQC_CLOUD_SQL_CONNECTION_NAME: "<PROJECT_ID>:<REGION>:<CLOUD_SQL_INSTANCE>"
  PQC_DB_NAME: "pqc_workspace"
  PQC_DB_USER: "pqc_app"
  # PQC_DB_PASSWORD, PQC_AUTH_SECRET, and PQC_GOOGLE_OAUTH_CLIENT_SECRET MUST be injected via Secret Manager (--set-secrets)
  PQC_KMS_KEY_NAME: "projects/<PROJECT_ID>/locations/<REGION>/keyRings/<KEYRING>/cryptoKeys/<PORTAL_KEK>"
  PQC_ARTIFACT_BUCKET: "gs://pqc-inventory-agent-cd06-pqc-agent-staging"
  PQC_ALLOW_UNVERIFIED_SIGNIN: "false"
  PQC_ENABLE_ADK_DEV_UI: "false"
  PQC_ENABLE_ADK_API: "false"
  PQC_ENABLE_GIS_JAVASCRIPT_CLIENT: "false"
