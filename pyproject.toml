[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-inventory-agent"
version = "2.10.0"
description = "Post-Quantum Cryptography (PQC) Compliance & Inventory Agent built with Google ADK and Vertex AI Agent Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "google-cloud-aiplatform[adk,agent_engines]>=1.75.0",
    "google-cloud-asset>=3.26.0",
    "google-cloud-kms>=2.24.0",
    "google-cloud-compute>=1.18.0",
    "google-cloud-storage>=2.16.0",
    "google-auth>=2.30.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "psycopg[binary]>=3.2.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["pqc_agent*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
